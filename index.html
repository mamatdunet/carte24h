// On mobile, we multiply the deltas to ~3x for better readability
if (IS_MOBILE) {
  const COL_CENTER_LAT = 47.940;
  const COL_CENTER_LON = 0.170; // shifted left to avoid overlapping circuit
  const SCALE = 2.5;
  Object.keys(EVENT_GPS).forEach(id => {
    const [lat, lon] = EVENT_GPS[id];
    if (lon < 0.201) {
      const newLat = COL_CENTER_LAT + (lat - COL_CENTER_LAT) * SCALE;
      const newLon = COL_CENTER_LON + (lon - 0.1845) * SCALE;
      EVENT_GPS[id] = [newLat, newLon];
    }
  });
}

function initMainMap() {
  if (satMap) return;
  if (typeof L === 'undefined') { setTimeout(initMainMap, 200); return; }
  satMap = L.map('sat-map', {
    center: [47.935, 0.218],
    zoom: 13,
    zoomControl: false,
    attributionControl: true,
  });
  // Dark background (default)
  // Fond de carte ouvert : tuiles OpenStreetMap (ODbL, sans cle d'API),
  // eclaircies et desaturees via un filtre CSS pour un rendu clair et epure.
  darkTileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19, className: 'osm-light',
  }).addTo(satMap);
  // IGN Orthophotos (added on toggle)
  satTileLayer = L.tileLayer('https://data.geopf.fr/wmts?'+
    'SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&TILEMATRIXSET=PM'+
    '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg'+
    '&TILECOL={x}&TILEROW={y}&TILEMATRIX={z}', {
    attribution: '\u00a9 IGN/G\u00e9oplateforme', maxZoom: 19,
  });
  // Zoom controls bottom right
  L.control.zoom({position:'bottomright'}).addTo(satMap);
  // Circuit trace (liseré sombre + ligne dorée)
  L.polyline(CIRCUIT_GPS_FULL, {color:'#2a2e38',weight:9,opacity:0.22,lineCap:'round',lineJoin:'round'}).addTo(satMap);
  L.polyline(CIRCUIT_GPS_FULL, {color:'#a8862f',weight:4,opacity:0.95,lineCap:'round',lineJoin:'round'}).addTo(satMap);
  // Dashed center line
  L.polyline(CIRCUIT_GPS_FULL, {color:'rgba(255,255,255,0.55)',weight:1,dashArray:'6,10',lineCap:'round'}).addTo(satMap);
  // Background panel behind the left columns (adapts to view mode and mobile)
  // Default panel bounds, scaled up on mobile
  const COL_CENTER_LAT = 47.940;
  const COL_CENTER_LON_ORIG = 0.1845;
  const COL_CENTER_LON_OUT = IS_MOBILE ? 0.170 : 0.1845;
  const SCALE = IS_MOBILE ? 2.5 : 1;
  function scalePt(lat, lon) {
    return [COL_CENTER_LAT + (lat - COL_CENTER_LAT) * SCALE,
            COL_CENTER_LON_OUT + (lon - COL_CENTER_LON_ORIG) * SCALE];
  }
  const panelBounds = [scalePt(47.924, 0.168), scalePt(47.956, 0.201)];
  window._leftPanelBg = L.rectangle(panelBounds, {
    color: 'rgba(90,80,50,0.35)',
    weight: 1,
    fillColor: '#ffffff',
    fillOpacity: 0.72,
    interactive: false,
  }).addTo(satMap);
  // "Events without location" title at top of panel
  L.marker(scalePt(47.9555, 0.1845), {
    icon: L.divIcon({
      className:'panel-title',
      html:'<div style="font-family:Oswald,sans-serif;font-size:' + (IS_MOBILE ? '14' : '12') + 'px;font-weight:700;letter-spacing:0.15em;color:#7d6220;text-transform:uppercase;text-shadow:0 1px 2px rgba(255,255,255,0.95),0 0 8px rgba(255,255,255,0.9);white-space:nowrap;text-align:center;pointer-events:none">Événements sans localisation</div>',
      iconSize:[320,18], iconAnchor:[160,9],
    }),
    interactive: false,
  }).addTo(satMap);
  // Column labels on the left (category headers)
  const RAW_COLUMN_LABELS = [
    {lat:47.9530, lon:0.172, text:'GP EXPLORER', color:'#b02e78'},
    {lat:47.9530, lon:0.177, text:'MOTO', color:'#1f8b99'},
    {lat:47.9530, lon:0.182, text:'RECORDS', color:'#8a6a1e'},
    {lat:47.9530, lon:0.187, text:'VICTOIRES', color:'#2e8540'},
    {lat:47.9530, lon:0.192, text:'INSOLITE', color:'#4e8f2a'},
    {lat:47.9530, lon:0.197, text:'MÉMORIAL', color:'#6f479b'},
  ];
  const COLUMN_LABELS = RAW_COLUMN_LABELS.map(l => { const [lat,lon]=scalePt(l.lat,l.lon); return {lat,lon,text:l.text,color:l.color}; });
  COLUMN_LABELS.forEach(l => {
    L.marker([l.lat, l.lon], {
      icon: L.divIcon({
        className:'col-label',
        html:`<div style="font-family:Oswald,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;color:${l.color};text-transform:uppercase;text-shadow:0 1px 2px rgba(255,255,255,0.95),0 0 6px rgba(255,255,255,0.9);white-space:nowrap;pointer-events:none;text-align:center">${l.text}</div>`,
        iconSize:[80,16], iconAnchor:[40,8],
      }),
      interactive: false,
    }).addTo(satMap);
  });
  // Event markers
  EVENTS.forEach(ev => {
    const gps = EVENT_GPS[ev.id]; if(!gps) return;
    const [lat,lng] = gps;
    const m = L.circleMarker([lat,lng], {
      radius:7, fillColor:ev.color, fillOpacity:0.9, color:'#0a0c10', weight:1.5,
    }).addTo(satMap);
    // Hover tooltip with just the title
    m.bindTooltip(ev.title, {
      direction: 'top',
      offset: [0, -8],
      className: 'ev-tooltip',
      opacity: 1,
    });
    m.on('click', function(e) { L.DomEvent.stopPropagation(e); showPanel(ev); });
    m._evCat = ev.category;
    m._evId = ev.id;
    m._evColor = ev.color;
    satMarkers.push(m);
  });
  // Fit bounds to include both circuit AND (scaled) left columns
  const fullBounds = L.latLngBounds(CIRCUIT_GPS_FULL)
    .extend(scalePt(47.923, 0.167))
    .extend(scalePt(47.957, 0.167))
    .extend(scalePt(47.957, 0.201))
    .extend(scalePt(47.923, 0.201));
  satMap.fitBounds(fullBounds, {padding:[20,20]});
  // Close panel on map click (not on marker click)
  satMap.on('click', function() { closePanel(); });
}
// Init map on load
initMainMap();

// Deep linking: open event from URL hash (#ev=id)
function openFromHash() {
  const h = window.location.hash;
  const m = h.match(/#ev=([a-zA-Z0-9_]+)/);
  if (m) {
    const ev = EVENTS.find(e => e.id === m[1]);
    if (ev) {
      setTimeout(() => showPanel(ev), 300);
      return true;
    }
  }
  return false;
}
openFromHash();
window.addEventListener('hashchange', () => {
  if (!openFromHash()) closePanel();
});

let searchQuery = '';
function matchesSearch(ev) {
  if (!searchQuery) return true;
  const q = searchQuery.toLowerCase();
  return (ev.title || '').toLowerCase().includes(q)
      || (ev.body || '').toLowerCase().includes(q);
}

function filterSatMarkers() {
  if (!satMap) return;
  satMarkers.forEach(m => {
    const ev = EVENTS.find(e => e.id === m._evId);
    const catOk = activeFilter === 'all' || m._evCat === activeFilter;
    const searchOk = !ev || matchesSearch(ev);
    if (catOk && searchOk) {
      if (!satMap.hasLayer(m)) satMap.addLayer(m);
    } else { satMap.removeLayer(m); }
  });
}

// Timeline: horizontal chronological frise (each event is ~36px apart for clarity)
(function buildTimeline(){
  const tl = document.getElementById('timeline');
  if (!tl) return;
  tl.innerHTML = '';
  const inner = document.createElement('div');
  inner.id = 'timeline-inner';
  const line = document.createElement('div');
  line.id = 'timeline-line';
  inner.appendChild(line);

  // Use year-based positioning with min spacing
  const EVENT_SPACING = 36; // px minimum between events
  // Group events by year to handle same-year events
  const byYear = {};
  EVENTS_SORTED.forEach(ev => {
    const y = extractYear(ev);
    if (!byYear[y]) byYear[y] = [];
    byYear[y].push(ev);
  });
  const years = Object.keys(byYear).map(Number).sort((a,b) => a-b);

  let x = 0;
  years.forEach(year => {
    const events = byYear[year];
    events.forEach((ev, idxInYear) => {
      const item = document.createElement('div');
      item.className = 'tl-item';
      item.style.background = ev.color;
      item.style.left = x + 'px';
      item.dataset.id = ev.id;
      item.dataset.cat = ev.category;
      // Year label only on first event of the year
      if (idxInYear === 0 && year < 9000) {
        const y = document.createElement('span');
        y.className = 'tl-year';
        y.textContent = year;
        item.appendChild(y);
      }
      const tip = document.createElement('span');
      tip.className = 'tl-tooltip';
      tip.textContent = ev.title;
      item.appendChild(tip);
      item.addEventListener('click', e => { e.stopPropagation(); showPanel(ev); });
      inner.appendChild(item);
      x += EVENT_SPACING;
    });
  });

  // Set inner width so the scroll works
  inner.style.width = (x + 40) + 'px';
  tl.appendChild(inner);

  // Scroll arrows
  const leftBtn = document.getElementById('tl-scroll-left');
  const rightBtn = document.getElementById('tl-scroll-right');
  let scrollInterval = null;
  function startScroll(dir) {
    stopScroll();
    scrollInterval = setInterval(() => { tl.scrollLeft += dir * 15; }, 16);
  }
  function stopScroll() { if (scrollInterval) { clearInterval(scrollInterval); scrollInterval = null; } }
  if (leftBtn) {
    leftBtn.addEventListener('click', () => tl.scrollBy({left: -400, behavior: 'smooth'}));
    leftBtn.addEventListener('mouseenter', () => startScroll(-1));
    leftBtn.addEventListener('mouseleave', stopScroll);
  }
  if (rightBtn) {
    rightBtn.addEventListener('click', () => tl.scrollBy({left: 400, behavior: 'smooth'}));
    rightBtn.addEventListener('mouseenter', () => startScroll(1));
    rightBtn.addEventListener('mouseleave', stopScroll);
  }
})();

function updateTimelineHighlight() {
  let activeEl = null;
  document.querySelectorAll('.tl-item').forEach(it => {
    const isActive = it.dataset.id === currentSelectedId;
    it.classList.toggle('active', isActive);
    if (isActive) activeEl = it;
    const catDimmed = activeFilter !== 'all' && it.dataset.cat !== activeFilter;
    const searchDimmed = searchQuery && !matchesSearch(EVENTS.find(e => e.id === it.dataset.id));
    it.classList.toggle('dimmed', catDimmed || searchDimmed);
  });
  // Scroll timeline to center the active event
  if (activeEl) {
    const tl = document.getElementById('timeline');
    const elLeft = parseFloat(activeEl.style.left || 0);
    tl.scrollTo({left: elLeft - tl.clientWidth / 2, behavior: 'smooth'});
  }
}

// Search input handler
(function initSearch(){
  const input = document.getElementById('search-input');
  const box = document.getElementById('search-box');
  const clear = document.getElementById('search-clear');
  if (!input) return;
  input.addEventListener('input', () => {
    searchQuery = input.value.trim();
    box.classList.toggle('has-value', !!searchQuery);
    filterSatMarkers();
    updateTimelineHighlight();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value=''; searchQuery=''; box.classList.remove('has-value'); filterSatMarkers(); updateTimelineHighlight(); input.blur(); }
  });
  clear.addEventListener('click', () => { input.value=''; searchQuery=''; box.classList.remove('has-value'); filterSatMarkers(); updateTimelineHighlight(); input.focus(); });
})();

function toggleSat() {
  satActive = !satActive;
  const btn = document.getElementById('btn-sat');
  btn.classList.toggle('active', satActive);
  btn.textContent = satActive ? '✕ Fermer satellite' : 'Vue satellite';
  // Bascule le halo des libellés (clair sur fond clair, sombre sur satellite)
  document.getElementById('sat-map').classList.toggle('sat-on', satActive);
  if (satActive) {
    satMap.removeLayer(darkTileLayer);
    satTileLayer.addTo(satMap);
    // Switch panel background to black for contrast on satellite
    if (window._leftPanelBg) window._leftPanelBg.setStyle({fillColor:'#000000', fillOpacity:0.55});
  } else {
    satMap.removeLayer(satTileLayer);
    darkTileLayer.addTo(satMap);
    // Back to a light card on the light basemap
    if (window._leftPanelBg) window._leftPanelBg.setStyle({fillColor:'#ffffff', fillOpacity:0.72});
  }
}

window.onerror = function(msg, src, line, col, err) {
  console.error('Global error:', msg, 'line:', line, err);
};

</script>
